<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH PORTAL 2026 — Математикалық әлемге саяхат</title>
    <style>
        /* ==========================================================================
           1. ЖАЛПЫ СТИЛЬДЕР ЖӘНЕ ДИЗАЙН ЖҮЙЕСІ (ОФФЛАЙН, ИНТЕРАКТИВТІ ТАҚТАҒА БЕЙІМ)
           ========================================================================== */
        :root {
            --bg-deep: #040814;
            --bg-navy: #0a1428;
            --bg-card: rgba(13, 25, 48, 0.78);
            --bg-card-solid: #0d1930;
            --gold-primary: #f5b942;
            --gold-light: #ffe08a;
            --gold-dark: #b87d14;
            --gold-glow: rgba(245, 185, 66, 0.45);
            --cyan-glow: rgba(56, 189, 248, 0.35);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --green-team: #10b981;
            --green-bg: rgba(16, 185, 129, 0.18);
            --blue-team: #3b82f6;
            --blue-bg: rgba(59, 130, 246, 0.18);
            --gold-team: #f59e0b;
            --gold-bg: rgba(245, 158, 11, 0.18);
            --red-soft: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.18);
            --border-glass: rgba(245, 185, 66, 0.3);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --font-main: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            line-height: 1.45;
        }

        /* Ғарыштық фондық Canvas */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Жоғарғы басқару және құндылық жолағы */
        .top-hud {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5, 11, 26, 0.9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-glass);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .hud-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-logo-ring {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(245,185,66,0.25), transparent);
            box-shadow: 0 0 15px var(--gold-glow);
            font-weight: 800;
            color: var(--gold-light);
            font-size: 16px;
        }

        .hud-title-group h1 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud-value-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 185, 66, 0.12);
            border: 1px solid rgba(245, 185, 66, 0.4);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.92rem;
            color: var(--gold-light);
            font-weight: 600;
        }

        /* Таймер панелі */
        .hud-timers {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 29, 56, 0.85);
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }

        .timer-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timer-digits {
            font-size: 1.25rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--gold-light);
            transition: color 0.3s;
        }

        .timer-digits.warning {
            color: #fb923c;
            animation: pulseText 1s infinite;
        }

        .timer-digits.danger {
            color: #ef4444;
            animation: pulseText 0.6s infinite;
        }

        .timer-controls {
            display: flex;
            gap: 4px;
        }

        /* Батырмалар жүйесі */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-sm {
            padding: 6px 11px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .btn-xs {
            padding: 4px 8px;
            font-size: 0.78rem;
            border-radius: 6px;
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 1.15rem;
            border-radius: var(--radius-md);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f5b942 0%, #d97706 100%);
            color: #090d16;
            box-shadow: 0 4px 18px rgba(245, 185, 66, 0.35);
            border-color: #fde68a;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%);
            box-shadow: 0 6px 24px rgba(245, 185, 66, 0.55);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-glass:hover {
            background: rgba(245, 185, 66, 0.16);
            border-color: var(--gold-primary);
            color: var(--gold-light);
        }

        .btn-green {
            background: rgba(16, 185, 129, 0.22);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.5);
        }

        .btn-green:hover {
            background: rgba(16, 185, 129, 0.35);
        }

        .btn-blue {
            background: rgba(59, 130, 246, 0.22);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.5);
        }

        .btn-blue:hover {
            background: rgba(59, 130, 246, 0.35);
        }

        .btn-red {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.45);
        }

        .btn-red:hover {
            background: rgba(239, 68, 68, 0.35);
        }

        /* Кезеңдер навигациясы (Прогресс индикатор) */
        .stage-stepper {
            position: relative;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(8, 16, 34, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
        }

        .step-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .step-pill:hover {
            background: rgba(245, 185, 66, 0.12);
            color: var(--gold-light);
        }

        .step-pill.active {
            background: linear-gradient(135deg, rgba(245, 185, 66, 0.25), rgba(217, 119, 6, 0.25));
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 0 12px rgba(245, 185, 66, 0.25);
        }

        .step-pill.completed {
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        /* Негізгі жұмыс аймағы */
        #main-stage-container {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            max-width: 1520px;
            margin: 0 auto;
            padding: 20px 24px 80px;
            display: flex;
            flex-direction: column;
        }

        /* Портал ауысу анимациясы */
        .portal-view {
            animation: portalEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
        }

        @keyframes portalEnter {
            0% { opacity: 0; transform: scale(0.96) translateY(12px); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Glassmorphism карточкалар */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .portal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(245, 185, 66, 0.25);
        }

        .portal-title-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .portal-icon-box {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(245,185,66,0.22), rgba(56,189,248,0.15));
            border: 1px solid var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 0 20px rgba(245,185,66,0.25);
        }

        .portal-title-wrap h2 {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--gold-light);
            letter-spacing: 0.4px;
        }

        .portal-motto {
            font-size: 1.02rem;
            color: #93c5fd;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ==========================================================================
           2. МАТЕМАТИКАЛЫҚ БӨЛШЕКТЕР КОМПОНЕНТІ (ҚАТАҢ ТАЛАП: ТЕК ТІК БӨЛШЕК)
           ========================================================================== */
        .math-expr {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            vertical-align: middle;
            font-size: 1.35rem;
        }

        .math-expr.xl {
            font-size: 1.85rem;
        }

        .math-expr.sm {
            font-size: 1.05rem;
        }

        .mixed-num {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            vertical-align: middle;
        }

        .whole-part {
            font-weight: 800;
            line-height: 1;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            line-height: 1.05;
            font-size: 0.78em;
            font-weight: 700;
        }

        .frac-num {
            padding: 0 4px 2px;
            border-bottom: 2px solid currentColor;
            text-align: center;
            min-width: 18px;
        }

        .frac-den {
            padding: 2px 4px 0;
            text-align: center;
            min-width: 18px;
        }

        /* ==========================================================================
           3. START PORTAL & ВИДЕО ПЛЕЕР
           ========================================================================== */
        .hero-portal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 72vh;
            position: relative;
        }

        .golden-ring-3d {
            position: relative;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            background: radial-gradient(circle, rgba(245, 185, 66, 0.18) 0%, rgba(10, 20, 40, 0.85) 68%, transparent 72%);
            box-shadow: 0 0 60px rgba(245, 185, 66, 0.35), inset 0 0 40px rgba(56, 189, 248, 0.3);
        }

        .golden-ring-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px dashed var(--gold-primary);
            animation: spinSlow 24s linear infinite;
        }

        .golden-ring-3d::after {
            content: '';
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            border: 3px solid var(--gold-light);
            box-shadow: 0 0 25px var(--gold-primary);
            animation: spinSlow 16s linear infinite reverse;
        }

        .video-theatre {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            background: #02050e;
            border: 2px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(245, 185, 66, 0.25);
        }

        .video-aspect-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-aspect-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-fallback-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #0e1d3d 0%, #050a17 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            gap: 16px;
        }

        .video-controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(10, 20, 40, 0.95);
            border-top: 1px solid rgba(245, 185, 66, 0.25);
        }

        /* ==========================================================================
           4. IDENTITY & MAGIC PORTAL КАРТОЧКАЛАРЫ
           ========================================================================== */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }

        .student-card {
            background: rgba(15, 29, 58, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s;
        }

        .student-card.present {
            border-color: rgba(16, 185, 129, 0.55);
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.12), rgba(15, 29, 58, 0.9));
        }

        .student-card.absent {
            border-color: rgba(239, 68, 68, 0.45);
            background: rgba(239, 68, 68, 0.08);
            opacity: 0.72;
        }

        .magic-portal-card {
            position: relative;
            background: radial-gradient(circle at top, rgba(245, 185, 66, 0.22), rgba(11, 22, 46, 0.92));
            border: 2px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .magic-portal-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(245, 185, 66, 0.35);
        }

        .magic-portal-card.done {
            border-color: #10b981;
            background: radial-gradient(circle at top, rgba(16, 185, 129, 0.22), rgba(11, 22, 46, 0.92));
        }

        /* ==========================================================================
           5. ТАРСИЯ ИНТЕРАКТИВТІ АЛТЫБҰРЫШ
           ========================================================================== */
        .tarsia-workspace {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .tarsia-workspace {
                grid-template-columns: 1fr;
            }
        }

        .tarsia-board-box {
            background: radial-gradient(circle at center, rgba(20, 38, 74, 0.9), rgba(6, 12, 28, 0.95));
            border: 2px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 540px;
            position: relative;
        }

        /* ==========================================================================
           6. 3D ҚОРЫТПА ЗЕРТХАНАСЫ (REAL LIFE PORTAL)
           ========================================================================== */
        .alloy-lab-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 20px;
        }

        @media (max-width: 980px) {
            .alloy-lab-grid {
                grid-template-columns: 1fr;
            }
        }

        .metal-ingot {
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .metal-ingot:hover {
            transform: translateY(-3px);
        }

        .metal-ingot.on-scale {
            border-color: var(--gold-light);
            box-shadow: 0 0 22px var(--gold-glow);
        }

        .metal-copper {
            background: linear-gradient(135deg, #b85d3b 0%, #7c3219 100%);
        }

        .metal-zinc {
            background: linear-gradient(135deg, #64748b 0%, #334155 100%);
        }

        .metal-tin {
            background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%);
            color: #0f172a;
        }

        /* ==========================================================================
           7. МОДАЛЬДЫ ТЕРЕЗЕЛЕР ЖӘНЕ TEACHER CONTROL PANEL
           ========================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 18, 0.82);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
            animation: portalEnter 0.25s ease;
        }

        .modal-card {
            background: var(--bg-card-solid);
            border: 2px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 780px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 35px rgba(245, 185, 66, 0.25);
        }

        /* Мұғалімнің жылжымалы панелі */
        .teacher-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 960px;
            height: 100vh;
            background: #070e20;
            border-left: 2px solid var(--gold-primary);
            z-index: 90;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.85);
        }

        .teacher-drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 16px 22px;
            background: #0b1630;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .drawer-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 22px;
            background: #091226;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
        }

        /* Кестелер */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .data-table th, .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .data-table th {
            background: rgba(245, 185, 66, 0.12);
            color: var(--gold-light);
            font-weight: 700;
        }

        /* Қалқымалы хабарлама (Toast) */
        #toast-container {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-msg {
            background: rgba(11, 22, 46, 0.96);
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.98rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            animation: portalEnter 0.25s ease;
        }

        /* Төменгі жылдам навигация */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 45;
            background: rgba(5, 11, 26, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(245, 185, 66, 0.22);

        try {

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function renderMathTokens(tokens, sizeClass = '') {
        if (!Array.isArray(tokens)) return String(tokens);
        const html = tokens.map(t => {
            if (typeof t === 'string') {
                return `<span>${t}</span>`;
            }
            const whole = t.w !== undefined ? `<span class="whole-part">${t.w}</span>` : '';
            const frac = (t.n !== undefined && t.d !== undefined)
                ? `<span class="frac"><span class="frac-num">${t.n}</span><span class="frac-den">${t.d}</span></span>`
                : '';
            return `<span class="mixed-num">${whole}${frac}</span>`;
        }).join('');
        return `<span class="math-expr ${sizeClass}">${html}</span>`;
    }

    /* Мәтіндегі '4 2/5' сияқты бөлшектерді автоматты түрде тік бөлшекке айналдыру */
    function formatRichMathText(text) {
        if (!text) return '';
        // Алдымен аралас сандарды: (бүтін) (алым)/(бөлім)
        let res = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(\d+)\s+(\d+)\/(\d+)/g, (_, w, n, d) => {
            return `<span class="mixed-num"><span class="whole-part">${w}</span><span class="frac"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span></span>`;
        });
        // Содан кейін жай бөлшектерді: (алым)/(бөлім)
        res = res.replace(/(^|[^\d>])(\d+)\/(\d+)/g, (_, prefix, n, d) => {
            return `${prefix}<span class="frac"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span>`;
        });
        res = res.replace(/\(([^()<>]+)\)\/(\d+)/g, (_, n, d) => `<span class="frac"><span class="frac-num">(${n})</span><span class="frac-den">${d}</span></span>`);
        return res;
    }

    }

    function formatSeconds(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

        } else if (timerState.stageRemaining <= 30 && timerState.stageRemaining > 0) {
            stageEl.classList.add('warning');
        }

        document.getElementById('total-timer-display').textContent = formatSeconds(timerState.totalRemaining);
        document.getElementById('btn-timer-toggle').textContent = timerState.running ? '⏸' : '▶';
    }

    function toggleTimer() {
        if (timerState.running) {
            clearInterval(timerState.intervalId);
            timerState.running = false;
        } else {
            timerState.running = true;
            timerState.intervalId = setInterval(() => {
                if (timerState.stageRemaining > 0) {
                    timerState.stageRemaining--;
                    if (timerState.stageRemaining === 30 && !timerState.warned30) {
                        timerState.warned30 = true;
                        playSoftBell();
                        showToast('⏳ Кезеңнің аяқталуына 30 секунд қалды');
                    }
                    if (timerState.stageRemaining === 0) {
                        playSoftBell();
                        showToast(`🔔 «${STAGES[appState.currentStageIndex].name}» уақыты аяқталды. Келесі кезеңге өту үшін батырманы басыңыз.`);
                    }
                }
                if (timerState.totalRemaining > 0) {
                    timerState.totalRemaining--;
                }
                updateTimerUI();
                saveState();
            }, 1000);
        }
        updateTimerUI();
    }

    function resetStageTimer() {
        timerState.stageRemaining = STAGES[appState.currentStageIndex].duration;
        timerState.warned30 = false;
        updateTimerUI();
        saveState();
    }

    function adjustStageTimer(delta) {
        timerState.stageRemaining = Math.max(0, timerState.stageRemaining + delta);
        updateTimerUI();
        saveState();
    }

    /* ==========================================================================
       6. КЕЗЕҢДЕР АРАСЫНДА АУЫСУ ЖӘНЕ HUD ЖАҢАРТУ
       ========================================================================== */
    function goToStage(index, autoStartTimer = false) {
        if (index < 0 || index >= STAGES.length) return;
        appState.currentStageIndex = index;
        timerState.stageRemaining = STAGES[index].duration;
        timerState.warned30 = false;
        if (autoStartTimer && !timerState.running) {
            toggleTimer();
        }
        saveState();
        renderAll();
    }

    function nextStage() {
        if (appState.currentStageIndex < STAGES.length - 1) {
            goToStage(appState.currentStageIndex + 1);
        }
    }

    function prevStage() {
        if (appState.currentStageIndex > 0) {
            goToStage(appState.currentStageIndex - 1);
        }
    }

    function renderStepper() {
        const stepper = document.getElementById('stage-stepper');
        stepper.innerHTML = STAGES.map((st, idx) => {
            const cls = idx === appState.currentStageIndex ? 'active' : (idx < appState.currentStageIndex ? 'completed' : '');
            return `<button class="step-pill ${cls}" onclick="goToStage(${idx})">${st.icon} ${st.code}</button>`;
        }).join('');
    }

                    </p>

                        <label class="btn btn-gold" style="cursor: pointer;">
                            📁 Видеоны компьютерден таңдау
                            <input type="file" accept="video/mp4,video/*" style="display: none;" onchange="loadLocalVideoFile(event, '${playerId}')">
                        </label>
                        <button class="btn btn-glass" onclick="${onEndCallbackName}()">⏭ Видеосыз жалғастыру</button>
                    </div>
                </div>
            </div>
            <div class="video-controls-bar">
                <div style="font-weight: 700; color: var(--gold-light);">🎞 ${title} (${fileName})</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-gold btn-sm" onclick="controlVideo('${playerId}', 'play')">▶ Ойнату</button>
                    <button class="btn btn-glass btn-sm" onclick="controlVideo('${playerId}', 'pause')">⏸ Тоқтату</button>
                    <button class="btn btn-glass btn-sm" onclick="controlVideo('${playerId}', 'replay')">↺ Қайта ойнату</button>
                    <button class="btn btn-glass btn-sm" onclick="controlVideo('${playerId}', 'mute')" id="${playerId}-mute-btn">🔊 Дыбыс</button>
                    <button class="btn btn-glass btn-sm" onclick="controlVideo('${playerId}', 'fullscreen')">⛶ Толық экран</button>

                </div>
            </div>
        </div>`;
    }

    function handleVideoError(playerId) {
        const fb = document.getElementById(`${playerId}-fallback`);
        if (fb) fb.style.display = 'flex';
    }

    function loadLocalVideoFile(event, playerId) {
        const file = event.target.files[0];
        if (!file) return;
        const vid = document.getElementById(playerId);
        const fb = document.getElementById(`${playerId}-fallback`);
        vid.src = URL.createObjectURL(file);
        if (fb) fb.style.display = 'none';
        vid.play().catch(() => {});
    }

    function controlVideo(playerId, action) {
        const vid = document.getElementById(playerId);
        if (!vid) return;
        if (action === 'play') {
            vid.play().catch(() => handleVideoError(playerId));
        } else if (action === 'pause') {
            vid.pause();
        } else if (action === 'replay') {
            vid.currentTime = 0;
            vid.play().catch(() => {});
        } else if (action === 'mute') {
            vid.muted = !vid.muted;
            const btn = document.getElementById(`${playerId}-mute-btn`);
            if (btn) btn.textContent = vid.muted ? '🔇 Өшірулі' : '🔊 Дыбыс';
        } else if (action === 'fullscreen') {
            if (vid.requestFullscreen) vid.requestFullscreen();
        }
    }

            saveState();

    }

    function setStudentPresence(id, isPresent) {
        const st = appState.students.find(s => s.id === id);
        if (st) {
            st.present = isPresent;
            if (isPresent && st.teamIndex === null) {
                assignBalancedTeams(false);
            }
            saveState();
            renderAll();
        }
    }

    function markAllPresent() {
        appState.students.forEach(s => s.present = true);

        showToast('✅ Барлық оқушы «Қатысты» деп белгіленді. Енді тек келмегендерді белгілей аласыз.');
    }

    function resizeStudentList(newCount) {
        const count = Math.max(1, Math.min(40, parseInt(newCount) || 15));
        if (count > appState.students.length) {
            for (let i = appState.students.length + 1; i <= count; i++) {
                appState.students.push(createEmptyStudent(i, ''));
            }
        } else if (count < appState.students.length) {
            appState.students = appState.students.slice(0, count);
        }
        assignBalancedTeams(false);
        saveState();
        renderAll();
    }

        if (appState.students.length >= 40) {
            showToast('Ең көбі 40 оқушы қосуға болады');

        const newId = appState.students.length ? Math.max(...appState.students.map(s => s.id)) + 1 : 1;
        appState.students.push(createEmptyStudent(newId, ''));
        assignBalancedTeams(false);
        saveState();
        renderAll();
        showToast('➕ Жаңа оқушы карточкасы қосылды');
    }

    function deleteStudent(id) {
        appState.students = appState.students.filter(s => s.id !== id);

       10. ТОПҚА ТЕҢГЕРІМДІ БӨЛУ ЖӘНЕ ЖҰП/ҮШТІК ҚҰРАСТЫРУ ЛОГИКАСЫ
       ========================================================================== */
    function assignBalancedTeams(forceReshuffle = false) {
        const presentStudents = appState.students.filter(s => s.present);
        const k = Math.max(2, Math.min(6, appState.teamCount || 3));

        // Егер қайта бөлу талап етілмесе және барлық қатысушыларда жарамды топ болса, сақтаймыз
        if (!forceReshuffle && presentStudents.length > 0) {
            const allHaveValidTeam = presentStudents.every(s => s.teamIndex !== null && s.teamIndex >= 0 && s.teamIndex < k);
            if (allHaveValidTeam) {
                buildPairsAndTriples();
                return;
            }
        }

        // Кездейсоқ араластыру (Fisher-Yates)
        const shuffled = [...presentStudents];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        // Теңгерімді бөлу: мысалы 15 -> 5,5,5; 14 -> 5,5,4; 13 -> 5,4,4
        shuffled.forEach((st, idx) => {
            st.teamIndex = idx % k;
            st.wishIndex = idx % MOTIVATIONAL_WISHES.length;
            st.theoryTaskId = (idx % THEORY_TASKS.length) + 1;
        });

        // Қатыспаған оқушылардың тобын тазалау
        appState.students.filter(s => !s.present).forEach(s => {
            s.teamIndex = null;
            s.pairGroup = '';
        });

        buildPairsAndTriples();
        saveState();
    }

    function buildPairsAndTriples() {
        const k = appState.teamCount || 3;
        for (let t = 0; t < k; t++) {
            const members = appState.students.filter(s => s.present && s.teamIndex === t);
            const n = members.length;
            if (n === 0) continue;
            if (n === 1) {
                members[0].pairGroup = `${TEAM_TEMPLATES[t].name}: Жеке/Қосымша`;
            } else if (n % 2 === 0) {
                // Жұп сан -> барлығы жұптар
                for (let i = 0; i < n; i += 2) {
                    const pairNum = Math.floor(i / 2) + 1;
                    members[i].pairGroup = `${TEAM_TEMPLATES[t].name} — Жұп №${pairNum}`;
                    members[i + 1].pairGroup = `${TEAM_TEMPLATES[t].name} — Жұп №${pairNum}`;
                }
            } else {
                // Тақ сан (>=3) -> алғашқылары жұптар, соңғы 3 оқушы бір үштік (мысалы 5 -> 1 жұп + 1 үштік)
                const pairsEnd = n - 3;
                for (let i = 0; i < pairsEnd; i += 2) {
                    const pairNum = Math.floor(i / 2) + 1;
                    members[i].pairGroup = `${TEAM_TEMPLATES[t].name} — Жұп №${pairNum}`;
                    members[i + 1].pairGroup = `${TEAM_TEMPLATES[t].name} — Жұп №${pairNum}`;
                }
                members[n - 3].pairGroup = `${TEAM_TEMPLATES[t].name} — Үштік №1`;
                members[n - 2].pairGroup = `${TEAM_TEMPLATES[t].name} — Үштік №1`;
                members[n - 1].pairGroup = `${TEAM_TEMPLATES[t].name} — Үштік №1`;
            }
        }
    }

    function completeEnergyBoost() {
        energyFinished = true;
        playSuccessChime();
        renderAll();

    /* ==========================================================================
       15. ЭКРАН 7: PUZZLE PORTAL — «ТАРСИЯ» ТОПТЫҚ ЖҰМЫСЫ (ИНТЕРАКТИВТІ + A4 PRINT/SVG/PNG)
       ========================================================================== */
    /* Геометриялық тексерілген Тарсия:
       6 теңқабырғалы үшбұрыш (0..5) центрдің айналасында сағат тілімен орналасқан.
       Әр i-үшбұрыштың:
       - Сол жақ ішкі қабырғасы (leftEdge) алдыңғы (i+5)%6 үшбұрыштың оң жақ ішкі қабырғасымен (rightEdge) түйіседі!
       - Сыртқы қабырғасы (outerEdge) алтыбұрыштың сыртына қарайды (декоративті жұлдызша ✦).
       Бұл математикалық және геометриялық тұрғыдан 100% дәл түйісуді қамтамасыз етеді:
       - Үшбұрыш i: rightEdge = Есеп i (TARSIA_PAIRS[i].q), leftEdge = Жауап (i+5)%6 (TARSIA_PAIRS[(i+5)%6].a).
       - Ешбір үшбұрышта бір есеп пен оның өз жауабы бірге орналаспайды (i !== (i+5)%6)!
    */
    let selectedTarsiaSlot = null;

    function getTriangleContent(pieceId, teamIdx = 0) {
        const pairs = TARSIA_SETS[teamIdx] || TARSIA_SETS[0];
        const rightPair = pairs[pieceId];
        const leftPair = pairs[(pieceId + 5) % 6];
        return {
            pieceId,
            rightTokens: rightPair.q, // Есеп
            leftTokens: leftPair.a,   // Алдыңғы есептің жауабы
            outerSymbol: '✦'
        };
    }

    function checkTarsiaEdges() {
        const edgeMatches = [];
        for (let i = 0; i < 6; i++) {
            const next = (i + 1) % 6;
            const slotA = appState.tarsia.slots[i];
            const slotB = appState.tarsia.slots[next];
            const rotA = ((appState.tarsia.rotations[i] % 360) + 360) % 360;
            const rotB = ((appState.tarsia.rotations[next] % 360) + 360) % 360;

            // Үшбұрыш өз орнында (slotA === i && slotB === next) және бұрылу бұрышы 0° болғанда ішкі қабырғалар дәл сәйкес келеді
            const isMatched = ((slotA + 1) % 6 === slotB && rotA === 0 && rotB === 0);
            edgeMatches.push(isMatched);
        }
        return edgeMatches;
    }

    function renderSVGFractionGroup(tokens, x, y, angleDeg, color = '#ffffff', fontSize = 14) {
        // SVG ішіндегі бүтін бөлік, алым, бөлім және көлденең сызық бір <g> ішінде айналады
        let cursorX = 0;
        const parts = [];
        tokens.forEach(t => {
            if (typeof t === 'string') {
                parts.push(`<text x="${cursorX}" y="4" fill="${color}" font-size="${fontSize}" font-weight="bold" text-anchor="middle">${t}</text>`);
                cursorX += fontSize * 0.9;
            } else {
                if (t.w !== undefined) {
                    const wStr = String(t.w);
                    parts.push(`<text x="${cursorX}" y="5" fill="${color}" font-size="${fontSize + 1}" font-weight="800" text-anchor="middle">${wStr}</text>`);
                    cursorX += wStr.length * (fontSize * 0.65) + 4;
                }
                if (t.n !== undefined && t.d !== undefined) {
                    const lineW = Math.max(String(t.n).length, String(t.d).length) * (fontSize * 0.55) + 8;
                    const cx = cursorX + lineW / 2 - 4;
                    parts.push(`<text x="${cx}" y="-4" fill="${color}" font-size="${fontSize - 2}" font-weight="700" text-anchor="middle">${t.n}</text>`);
                    parts.push(`<line x1="${cx - lineW/2}" y1="0" x2="${cx + lineW/2}" y2="0" stroke="${color}" stroke-width="1.6"/>`);
                    parts.push(`<text x="${cx}" y="${fontSize - 1}" fill="${color}" font-size="${fontSize - 2}" font-weight="700" text-anchor="middle">${t.d}</text>`);
                    cursorX += lineW + 4;
                }
            }
        });
        const offsetX = -cursorX / 2 + 4;
        return `<g transform="translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleDeg}) translate(${offsetX.toFixed(1)}, 0)">${parts.join('')}</g>`;
    }

    function buildTarsiaSVGString(options = { mode: 'interactive', teamIdx: 0, bw: false, solved: false }) {
        const R = 215;
        const tm = TEAM_TEMPLATES[options.teamIdx] || TEAM_TEMPLATES[0];
        const strokeColor = options.bw ? '#000000' : tm.color;
        const fillColor = options.bw ? '#ffffff' : 'rgba(13, 27, 56, 0.92)';
        const textColor = options.bw ? '#000000' : '#f8fafc';
        const edgeMatches = options.solved ? [true,true,true,true,true,true] : checkTarsiaEdges();

        let svgInner = '';

        // Интерактивті режимде дұрыс жиналған алтыбұрыш
        for (let pos = 0; pos < 6; pos++) {
            const pieceId = options.solved ? pos : appState.tarsia.slots[pos];
            const rot = options.solved ? 0 : appState.tarsia.rotations[pos];
            const content = getTriangleContent(pieceId, options.teamIdx);

            // Позиция бұрыштары (центр 0,0)
            const a1 = (pos * 60 - 90) * Math.PI / 180;
            const a2 = ((pos + 1) * 60 - 90) * Math.PI / 180;
            const x1 = R * Math.cos(a1), y1 = R * Math.sin(a1);
            const x2 = R * Math.cos(a2), y2 = R * Math.sin(a2);

            // Үшбұрыштың ауырлық центрі (айналдыру нүктесі)
            const cx = (0 + x1 + x2) / 3;
            const cy = (0 + y1 + y2) / 3;

            const isSelected = options.mode === 'interactive' && selectedTarsiaSlot === pos;
            const polyStroke = isSelected ? '#ffe08a' : strokeColor;
            const polyWidth = isSelected ? 4 : 2.5;

            // Ішкі қабырғалардың орта нүктелері (0-ден P1-ге және 0-ден P2-ге)
            const leftMidX = x1 * 0.56, leftMidY = y1 * 0.56;
            const rightMidX = x2 * 0.56, rightMidY = y2 * 0.56;
            const outerMidX = (x1 + x2) * 0.44, outerMidY = (y1 + y2) * 0.44;

            const leftAngle = (pos * 60 - 90);
            const rightAngle = ((pos + 1) * 60 - 90);
            const outerAngle = (pos * 60 + 30);

            // Мәтінді үшбұрыш ішіне ығыстыру
            const normL = { x: (cx - leftMidX) * 0.34, y: (cy - leftMidY) * 0.34 };
            const normR = { x: (cx - rightMidX) * 0.34, y: (cy - rightMidY) * 0.34 };

            svgInner += `
            <g class="tarsia-piece" ${options.mode === 'interactive' ? `onclick="onTarsiaPieceClick(${pos})" style="cursor:pointer;"` : ''}>
                <g transform="rotate(${rot}, ${cx.toFixed(1)}, ${cy.toFixed(1)})">
                    <polygon points="0,0 ${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"
                        fill="${fillColor}" stroke="${polyStroke}" stroke-width="${polyWidth}" stroke-linejoin="round"/>
                    ${renderSVGFractionGroup(content.leftTokens, leftMidX + normL.x, leftMidY + normL.y, leftAngle, textColor, 13)}
                    ${renderSVGFractionGroup(content.rightTokens, rightMidX + normR.x, rightMidY + normR.y, rightAngle, textColor, 13)}
                    <text x="${outerMidX.toFixed(1)}" y="${outerMidY.toFixed(1)}" fill="${strokeColor}" font-size="14" text-anchor="middle" dominant-baseline="middle" transform="rotate(${outerAngle}, ${outerMidX.toFixed(1)}, ${outerMidY.toFixed(1)})">✦</text>
                </g>
            </g>`;
        }

        // Интерактивті режимде дұрыс түйіскен қабырғаларды жасыл неон сызықпен көрсету
        if (options.mode === 'interactive') {
            for (let i = 0; i < 6; i++) {
                if (edgeMatches[i]) {
                    const a = ((i + 1) * 60 - 90) * Math.PI / 180;
                    const x = R * Math.cos(a), y = R * Math.sin(a);
                    svgInner += `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>`;
                }
            }
        }

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-235 -235 470 470" width="100%" height="100%" style="max-width: 520px; max-height: 520px;">
            ${svgInner}
        </svg>`;
    }

    /* A4 басып шығаруға арналған бөлек-бөлек (қиып алуға ыңғайлы) 6 үшбұрышты SVG */
    function buildPrintableTarsiaA4SVG(teamIdx, bw = false, solved = false) {
        if (solved) {
            return buildTarsiaSVGString({ mode: 'print', teamIdx, bw, solved: true });
        }
        const tm = TEAM_TEMPLATES[teamIdx] || TEAM_TEMPLATES[0];
        const strokeColor = bw ? '#000000' : tm.color;
        const fillColor = bw ? '#ffffff' : '#f8fafc';
        const textColor = '#000000';

        // 2 баған x 3 қатар A4 бетінде ірі үшбұрыштар
        const shuffledOrder = [2, 5, 0, 4, 1, 3];
        const side = 220;
        const h = side * Math.sqrt(3) / 2;
        let shapes = '';

        shuffledOrder.forEach((pieceId, idx) => {
            const col = idx % 2;
            const row = Math.floor(idx / 2);
            const ox = 40 + col * 260;
            const oy = 30 + row * 225;

            const pTop = `${ox + side/2},${oy}`;
            const pLeft = `${ox},${oy + h}`;
            const pRight = `${ox + side},${oy + h}`;
            const content = getTriangleContent(pieceId, teamIdx);

            shapes += `
            <g>
                <polygon points="${pTop} ${pLeft} ${pRight}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="3" stroke-dasharray="8,4"/>
                ${renderSVGFractionGroup(content.rightTokens, ox + side*0.33, oy + h*0.52, -60, textColor, 12)}
                ${renderSVGFractionGroup(content.leftTokens, ox + side*0.67, oy + h*0.52, 60, textColor, 12)}
                <text x="${ox + side/2}" y="${oy + h - 14}" fill="${strokeColor}" font-size="15" font-weight="bold" text-anchor="middle">✦ Тарсия #${idx + 1} ✦</text>
            </g>`;
        });

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 710" width="100%" style="max-height: 235mm;">
            ${shapes}
        </svg>`;
    }

    function renderPuzzlePortal() {
        const edgeMatches = checkTarsiaEdges();
        const matchedCount = edgeMatches.filter(Boolean).length;
        const allSolved = matchedCount === 6;

        return `
        <div class="portal-view">
            <div class="portal-header">
                <div class="portal-title-wrap">
                    <div class="portal-icon-box">🧩</div>
                    <div>
                        <h2>PUZZLE PORTAL — «Тарсия» топтық жұмысы</h2>
                        <div class="portal-motto">«Міндеттерді әділ бөлісеміз, әркімнің пікірін құрметтейміз» • 4 дескриптор = 4 балл</div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-blue" onclick="openTeacherDrawer('grading')">📋 Тарсияны бағалау</button>
                    <button class="btn btn-gold" onclick="goToStage(7)">REAL LIFE PORTAL →</button>
                </div>
            </div>

            <div class="tarsia-workspace">
                <!-- Сол жақ: Цифрлық интерактивті Тарсия -->
                <div class="tarsia-board-box" style="${allSolved ? 'box-shadow: 0 0 45px rgba(245,185,66,0.55); border-color: var(--gold-light);' : ''}">
                    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
                        <div style="font-weight: 800; color: var(--gold-light);">
                            «${TEAM_TEMPLATES[appState.tarsia.selectedTeam].name}» тобы · Сәйкестендірілген қабырғалар: <span style="color: #6ee7b7;">${matchedCount} / 6</span>
                        </div>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <button class="btn btn-gold btn-sm" onclick="rotateSelectedTarsia()" ${selectedTarsiaSlot === null ? 'disabled' : ''}>↻ 120° бұру</button>
                            <button class="btn btn-glass btn-sm" onclick="shuffleTarsia()">🔀 Араластыру</button>
                            <button class="btn btn-glass btn-sm" onclick="resetTarsia()">↺ Бастапқы қалып</button>
                            <button class="btn btn-green btn-sm" onclick="appState.tarsia.showSolution = !appState.tarsia.showSolution; renderAll();">
                                ${appState.tarsia.showSolution ? '🙈 Шешімді жасыру' : '✨ Дұрыс шешімді ашу'}
                            </button>
                        </div>
                    </div>

                    ${allSolved || appState.tarsia.showSolution ? `
                        <div style="background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #6ee7b7; padding: 8px 18px; border-radius: 999px; font-weight: 800; margin-bottom: 8px;">
                            🎉 Алтын алтыбұрыш толық құрастырылды!
                        </div>
                    ` : `
                        <div style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 8px;">
                            Кеңес: Үшбұрышты таңдап <b>«120° бұру»</b> батырмасын басыңыз немесе екі үшбұрышты кезекпен басып орнын ауыстырыңыз.
                        </div>
                    `}

                    <div id="tarsia-svg-wrapper" style="width: 100%; display: flex; justify-content: center;">
                        ${buildTarsiaSVGString({
                            mode: 'interactive',
                            teamIdx: appState.tarsia.selectedTeam,
                            bw: false,
                            solved: appState.tarsia.showSolution
                        })}
                    </div>
                </div>

                <!-- Оң жақ: Топтарға арналған A4 жүктеу және басып шығару панелі -->
                <div class="glass-panel" style="display: grid; gap: 14px;">
                    <h3 style="color: var(--gold-light); font-size: 1.15rem;">🖨️ Топтық Тарсия (A4 Жүктеу & Басып шығару)</h3>
                    <p style="font-size: 0.88rem; color: var(--text-muted);">
                        Әр топқа 6 түрлі есептен тұратын жеке жинақ беріледі. Күрделілігі мен дескрипторлары бірдей. A4 парағында есептер мен сәйкестендіруге арналған жауаптар араластырылған.
                    </p>

                    <div style="display: grid; gap: 8px;">
                        ${[0, 1, 2].map(idx => {
                            const tm = TEAM_TEMPLATES[idx];
                            return `
                            <div style="background: ${tm.bg}; border: 1px solid ${tm.color}; padding: 10px; border-radius: 12px;">
                                <div style="font-weight: 800; color: ${tm.color}; margin-bottom: 6px;">● «${tm.name}» тобы (${tm.label})</div>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                    <button class="btn btn-glass btn-xs" onclick="selectTarsiaTeam(${idx});">${appState.tarsia.selectedTeam===idx ? "✓ Таңдалды" : "Таңдау"}</button>
                                    <button class="btn btn-glass btn-xs" onclick="downloadTarsiaSVG(${idx}, false, false)">⬇ SVG</button>
                                    <button class="btn btn-glass btn-xs" onclick="downloadTarsiaPNG(${idx}, false, false)">⬇ PNG</button>
                                    <button class="btn btn-gold btn-xs" onclick="printTarsiaA4(${idx}, false, false)">🖨 A4 Басу</button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>

                    <hr style="border-color: rgba(255,255,255,0.1);">

                    <div style="display: grid; gap: 8px;">
                        <button class="btn btn-glass btn-sm" onclick="printAllTeamsTarsia()">🖨 Барлық 3 топқа A4 басып шығару</button>
                        <button class="btn btn-glass btn-sm" onclick="downloadTarsiaSVG(appState.tarsia.selectedTeam, true, false)">⬜ Ақ-қара нұсқа (SVG жүктеу)</button>
                        <button class="btn btn-glass btn-sm" onclick="printTarsiaA4(appState.tarsia.selectedTeam, true, false)">⬜ Ақ-қара нұсқа (A4 басу)</button>
                        <button class="btn btn-green btn-sm" onclick="printTarsiaA4(appState.tarsia.selectedTeam, false, true)">🔑 Мұғалімге: Дұрыс шешімді басу</button>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function onTarsiaPieceClick(pos) {
        if (appState.tarsia.showSolution) return;
        if (selectedTarsiaSlot === null) {
            selectedTarsiaSlot = pos;
        } else if (selectedTarsiaSlot === pos) {
            // Сол үшбұрышты қайта басса -> 120 градусқа бұрамыз
            appState.tarsia.rotations[pos] = (appState.tarsia.rotations[pos] + 120) % 360;
        } else {
            // Екі үшбұрыштың орнын ауыстыру
            const tmpSlot = appState.tarsia.slots[selectedTarsiaSlot];
            appState.tarsia.slots[selectedTarsiaSlot] = appState.tarsia.slots[pos];
            appState.tarsia.slots[pos] = tmpSlot;

            const tmpRot = appState.tarsia.rotations[selectedTarsiaSlot];
            appState.tarsia.rotations[selectedTarsiaSlot] = appState.tarsia.rotations[pos];
            appState.tarsia.rotations[pos] = tmpRot;

            selectedTarsiaSlot = null;
        }
        if (checkTarsiaEdges().every(Boolean)) playSuccessChime();
        saveState();
        renderAll();
    }

    function rotateSelectedTarsia() {
        if (selectedTarsiaSlot === null) return;
        appState.tarsia.rotations[selectedTarsiaSlot] = (appState.tarsia.rotations[selectedTarsiaSlot] + 120) % 360;
        if (checkTarsiaEdges().every(Boolean)) playSuccessChime();
        saveState();
        renderAll();
    }

    function selectTarsiaTeam(idx) {
        appState.tarsia.selectedTeam = idx;
        shuffleTarsia();
    }

    function shuffleTarsia() {
        appState.tarsia.showSolution = false;
        selectedTarsiaSlot = null;
        const arr = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
        appState.tarsia.slots = arr;
        appState.tarsia.rotations = arr.map(() => [0, 120, 240][Math.floor(Math.random() * 3)]);
        saveState();
        renderAll();
    }

    function resetTarsia() {
        appState.tarsia.showSolution = false;
        selectedTarsiaSlot = null;
        appState.tarsia.slots = [0, 1, 2, 3, 4, 5];
        appState.tarsia.rotations = [120, 240, 120, 240, 120, 240];
        saveState();
        renderAll();
    }

    /* Нақты SVG және PNG жүктеу (Blob + download атрибуты) */
    function downloadTarsiaSVG(teamIdx, bw = false, solved = false) {
        const tm = TEAM_TEMPLATES[teamIdx] || TEAM_TEMPLATES[0];
        const svgContent = buildPrintableTarsiaA4SVG(teamIdx, bw, solved);
        const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Tarsia_${bw ? tm.name + '_BW' : tm.name}_${solved ? 'Solution' : 'A4'}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

            const canvas = document.createElement('canvas');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            canvas.toBlob(pngBlob => {
                const pngUrl = URL.createObjectURL(pngBlob);
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = `Tarsia_${tm.name}_A4.png`;

       17. КРИТЕРИАЛДЫ БАҒАЛАУ ЕСЕПТЕУІШІ (10 БАЛЛДЫҚ ЖҮЙЕ)
       ========================================================================== */
    function calculateStudentScores(st) {
        // 1. Теория (1 балл)
        const theory = st.theoryFirstScore; // null, 0, немесе 1

        // 2. Үй тапсырмасы (4 * 0.25 = 1 балл)
        const hwRated = st.hwChecks.some(v => v !== null);
        const hw = hwRated ? st.hwChecks.reduce((acc, v) => acc + (v === true ? 0.25 : 0), 0) : null;

        // 3. Жеке жұмыс Math Lab (4 * 0.5 = 2 балл)
        const mlRated = st.mlChecks.some(v => v !== null);
        const ml = mlRated ? st.mlChecks.reduce((acc, v) => acc + (v === true ? 0.5 : 0), 0) : null;

        // 4. Тарсия (4 * 1 = 4 балл)
        const tarsiaRated = st.tarsiaChecks.some(v => v !== null);
        const tarsia = tarsiaRated ? st.tarsiaChecks.reduce((acc, v) => acc + (v === true ? 1 : 0), 0) : null;

        // 5. Функционалдық сауаттылық Real Life (2 * 1 = 2 балл)
        const rlRated = st.rlChecks.some(v => v !== null);
        const rl = rlRated ? st.rlChecks.reduce((acc, v) => acc + (v === true ? 1 : 0), 0) : null;

        const parts = [theory, hw, ml, tarsia, rl];
        const allRated = parts.every(p => p !== null);
        const anyRated = parts.some(p => p !== null);

        const rawSum = parts.reduce((acc, p) => acc + (p !== null ? p : 0), 0);
        const total = Math.min(10, Math.round(rawSum * 100) / 100);
        const percent = Math.round((total / 10) * 100);

        return { theory, hw, ml, tarsia, rl, allRated, anyRated, total, percent };
    }

    function getPedagogicalLevel(total, allRated) {
        if (!allRated) return { label: 'Аралық нәтиже (Толық бағаланбады)', color: '#94a3b8' };
        if (total >= 9) return { label: 'Жоғары нәтиже (9–10 балл)', color: '#10b981' };
        if (total >= 7) return { label: 'Жақсы нәтиже (7–8,75 балл)', color: '#3b82f6' };
        if (total >= 5) return { label: 'Қосымша жаттығу қажет (5–6,75 балл)', color: '#f59e0b' };
        return { label: 'Қосымша қолдау қажет (0–4,75 балл)', color: '#ef4444' };
    }

    function renderAnalyticsChartsHTML() {
        const present = appState.students.filter(s => s.present);
        if (present.length === 0) {
            return `<div class="glass-panel">Қатысқан оқушылар тізімі бос.</div>`;
        }

        // Әр кезең бойынша нақты орындалу пайызы (тек бағаланған оқушылар бойынша!)
        const calcStagePct = (extractor, maxVal) => {
            const vals = present.map(extractor).filter(v => v !== null);
            if (vals.length === 0) return null;
            const sum = vals.reduce((a, b) => a + b, 0);
            return Math.round((sum / (vals.length * maxVal)) * 100);
        };

        const pTheory = calcStagePct(s => calculateStudentScores(s).theory, 1);
        const pHw = calcStagePct(s => calculateStudentScores(s).hw, 1);
        const pMl = calcStagePct(s => calculateStudentScores(s).ml, 2);
        const pTarsia = calcStagePct(s => calculateStudentScores(s).tarsia, 4);
        const pRl = calcStagePct(s => calculateStudentScores(s).rl, 2);

        // Дағдылар: Қосу vs Азайту (Math Lab + Homework + Real Life дескрипторларынан)
        const addChecks = [];
        const subChecks = [];
        present.forEach(s => {
            if (s.hwChecks[0] !== null) addChecks.push(s.hwChecks[0] ? 1 : 0);
            if (s.hwChecks[1] !== null) addChecks.push(s.hwChecks[1] ? 1 : 0);
            if (s.mlChecks[0] !== null) addChecks.push(s.mlChecks[0] ? 1 : 0);
            if (s.mlChecks[1] !== null) addChecks.push(s.mlChecks[1] ? 1 : 0);
            if (s.tarsiaChecks[0] !== null) addChecks.push(s.tarsiaChecks[0] ? 1 : 0);

            if (s.hwChecks[2] !== null) subChecks.push(s.hwChecks[2] ? 1 : 0);
            if (s.hwChecks[3] !== null) subChecks.push(s.hwChecks[3] ? 1 : 0);
            if (s.mlChecks[2] !== null) subChecks.push(s.mlChecks[2] ? 1 : 0);
            if (s.mlChecks[3] !== null) subChecks.push(s.mlChecks[3] ? 1 : 0);
            if (s.tarsiaChecks[1] !== null) subChecks.push(s.tarsiaChecks[1] ? 1 : 0);
        });

        const addPct = addChecks.length ? Math.round((addChecks.reduce((a,b)=>a+b,0) / addChecks.length) * 100) : null;
        const subPct = subChecks.length ? Math.round((subChecks.reduce((a,b)=>a+b,0) / subChecks.length) * 100) : null;

        // Толық бағаланған оқушылардың шартты деңгейлері (Дөңгелек диаграмма үшін)
        const fullScores = present.map(s => calculateStudentScores(s)).filter(sc => sc.allRated);
        const lvlHigh = fullScores.filter(sc => sc.total >= 9).length;
        const lvlGood = fullScores.filter(sc => sc.total >= 7 && sc.total < 9).length;
        const lvlMid = fullScores.filter(sc => sc.total >= 5 && sc.total < 7).length;
        const lvlLow = fullScores.filter(sc => sc.total < 5).length;

        // Топтардың жиынтық орташа нәтижесі
        const teamBars = [0, 1, 2].map(tIdx => {
            const tm = TEAM_TEMPLATES[tIdx];
            const members = present.filter(s => s.teamIndex === tIdx).map(s => calculateStudentScores(s)).filter(sc => sc.anyRated);
            const avg = members.length ? (members.reduce((a,b)=>a+b.total,0) / members.length).toFixed(1) : null;
            return { tm, avg, pct: avg !== null ? Math.round((parseFloat(avg)/10)*100) : 0 };
        });

        // Автоматты педагогикалық ұсыныстар
        const recommendations = [];
        if (fullScores.length === 0 && addPct === null && subPct === null) {
            recommendations.push("Нақты педагогикалық қорытынды жасау үшін әзірге бағалау деректері жеткіліксіз.");
        } else {
            if (subPct !== null && subPct < 70) {
                recommendations.push("Аралас сандарды азайту кезінде бір бүтінді бөлшек бөлігіне айналдыру дағдысын қосымша бекіту ұсынылады.");
            }
            if (pTheory !== null && pTheory < 70) {
                recommendations.push("Ең кіші ортақ бөлім мен толықтауыш көбейткішті анықтау дағдыларын қайталау ұсынылады.");
            }
            if (pRl !== null && pRl < 70) {
                recommendations.push("Өмірлік жағдаяттарға берілген есептердің шартын талдау және шешу жоспарын құру дағдыларын дамыту ұсынылады.");
            }
            if (recommendations.length === 0) {
                recommendations.push("Сынып оқу мақсатын (5.1.2.20) жоғары деңгейде меңгерген. Күрделі логикалық есептер ұсынуға болады.");
            }
        }

        const stageBars = [
            { name: 'Теория (1 б)', pct: pTheory },
            { name: 'Үй жұмысы (1 б)', pct: pHw },
            { name: 'Жеке жұмыс (2 б)', pct: pMl },
            { name: 'Тарсия (4 б)', pct: pTarsia },
            { name: 'Функц. сауатт. (2 б)', pct: pRl }
        ];

        return `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px;">
            <!-- Бағандық диаграмма: Тапсырмалардың орындалу пайызы -->
            <div class="glass-panel">
                <h4 style="color: var(--gold-light); margin-bottom: 12px;">📊 Тапсырмалар бойынша орындалу көрсеткіші</h4>

                    ${stageBars.map(b => `
                        <div>

                                <b>${b.pct !== null ? b.pct + '%' : 'Бағаланбады'}</b>
                            </div>
                            <div style="height: 12px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden;">

                            </div>
                        </div>

            </div>

            <div class="glass-panel">
                <h4 style="color: var(--gold-light); margin-bottom: 12px;">⚖️ Қосу vs Азайту дағдылары және Топтар</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                    <div style="background: rgba(16,185,129,0.15); border: 1px solid #10b981; padding: 12px; border-radius: 12px; text-align: center;">
                        <div style="font-size: 0.85rem; color: #6ee7b7;">Қосу дағдысы</div>
                        <div style="font-size: 1.6rem; font-weight: 900;">${addPct !== null ? addPct + '%' : '—'}</div>
                    </div>
                    <div style="background: rgba(59,130,246,0.15); border: 1px solid #3b82f6; padding: 12px; border-radius: 12px; text-align: center;">
                        <div style="font-size: 0.85rem; color: #93c5fd;">Азайту дағдысы</div>
                        <div style="font-size: 1.6rem; font-weight: 900;">${subPct !== null ? subPct + '%' : '—'}</div>
                    </div>
                </div>
                <div style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px;">Топтардың орташа баллы:</div>
                ${teamBars.map(tb => `
                    <div style="margin-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.88rem;">
                            <span style="color: ${tb.tm.color}; font-weight: 700;">«${tb.tm.name}» тобы</span>
                            <b>${tb.avg !== null ? tb.avg + ' / 10' : 'Дерек жоқ'}</b>
                        </div>
                        <div style="height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden;">
                            <div style="height: 100%; width: ${tb.pct}%; background: ${tb.tm.color};"></div>
                        </div>
                    </div>
                `).join('')}
            </div>

            <!-- Дөңгелек диаграмма & Педагогикалық ұсыныстар -->
            <div class="glass-panel">
                <h4 style="color: var(--gold-light); margin-bottom: 10px;">🎯 Оқу нәтижелерін саралау (Толық бағаланғандар: ${fullScores.length})</h4>
                ${fullScores.length === 0 ? `<p style="color: var(--text-muted); font-size: 0.92rem;">Толық бағаланған оқушылар әлі жоқ (аралық нәтижелер қорытынды деңгейге кірмейді).</p>` : `
                    <div style="display: grid; gap: 6px; font-size: 0.92rem; margin-bottom: 12px;">
                        <div>🟢 Жоғары нәтиже (9–10 б): <b>${lvlHigh} оқушы</b></div>
                        <div>🔵 Жақсы нәтиже (7–8,75 б): <b>${lvlGood} оқушы</b></div>
                        <div>🟡 Қосымша жаттығу қажет (5–6,75 б): <b>${lvlMid} оқушы</b></div>
                        <div>🔴 Қосымша қолдау қажет (0–4,75 б): <b>${lvlLow} оқушы</b></div>
                    </div>
                `}
                <div style="background: rgba(245,185,66,0.12); border: 1px solid rgba(245,185,66,0.35); padding: 12px; border-radius: 12px;">
                    <div style="font-weight: 800; color: var(--gold-light); font-size: 0.92rem; margin-bottom: 6px;">💡 Автоматты педагогикалық ұсыныстар:</div>
                    <ul style="margin-left: 18px; font-size: 0.9rem; display: grid; gap: 4px;">
                        ${recommendations.map(r => `<li>${r}</li>`).join('')}
                    </ul>
                </div>
            </div>
        </div>`;
    }

    /* ==========================================================================
       19. ЭКРАН 10: FINAL PORTAL — РЕФЛЕКСИЯ, ҮЙ ТАПСЫРМАСЫ, FINAL.MP4, МИССИЯ ОРЫНДАЛДЫ
       ========================================================================== */
    let finalSubView = 'reflection'; // 'reflection' | 'video' | 'finale'

            "Серіктестеріме көмектестім",

        return `

                <div class="portal-title-wrap">
                    <div class="portal-icon-box">🏁</div>

                        <h2>FINAL PORTAL — Рефлексия және Келесі сабаққа үй тапсырмасы</h2>
                        <div class="portal-motto">Рефлексияға балл қойылмайды • Өз білімімді шынайы бағалаймын</div>
                    </div>
                </div>
                <button class="btn btn-gold btn-lg" onclick="launchFinalVideo()">🎬 Қорытынды видеоны қосу (final.mp4) →</button>
            </div>

            <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px;">
                <!-- Сол жақ: Екі бағытты рефлексия -->
                <div class="glass-panel">
                    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;">
                        <h3 style="color: var(--gold-light);">🧭 Оқушы рефлексиясы</h3>
                        <select class="input-dark" onchange="selectedReflStudentId=parseInt(this.value); renderAll();">
                            ${presentStudents.map(s => {
                                const idx = appState.students.findIndex(x => x.id === s.id);
                                return `<option value="${s.id}" ${activeSt && activeSt.id === s.id ? 'selected' : ''}>${getStudentDisplayName(s, idx)} ${s.reflectionMath ? '✔' : ''}</option>`;
                            }).join('')}
                        </select>
                    </div>

                    ${activeSt ? `
                    <!-- 1. Математикалық рефлексия -->
                    <div style="margin-bottom: 16px;">
                        <div style="font-weight: 700; color: #7dd3fc; margin-bottom: 8px;">1. Математикалық рефлексия (Порталды таңда):</div>
                        <div style="display: grid; gap: 8px;">
                            <button class="btn ${activeSt.reflectionMath === 'green' ? 'btn-green' : 'btn-glass'}" style="justify-content: flex-start; text-align: left;"
                                onclick="setMathReflection(${activeSt.id}, 'green')">
                                🟢 Жасыл портал: «Аралас сандарды қосу мен азайтуды түсіндім, өз бетімше орындай аламын»
                            </button>
                            <button class="btn ${activeSt.reflectionMath === 'yellow' ? 'btn-gold' : 'btn-glass'}" style="justify-content: flex-start; text-align: left;"
                                onclick="setMathReflection(${activeSt.id}, 'yellow')">
                                🟡 Сары портал: «Түсіндім, бірақ әлі де жаттығу қажет»
                            </button>
                            <button class="btn ${activeSt.reflectionMath === 'red' ? 'btn-red' : 'btn-glass'}" style="justify-content: flex-start; text-align: left;"
                                onclick="setMathReflection(${activeSt.id}, 'red')">
                                🔴 Қызыл портал: «Маған қосымша түсіндіру мен көмек қажет»

                    </div>

                    <!-- 2. Құндылық рефлексиясы -->

                        <div style="display: flex; flex-wrap: wrap; gap: 8px;">

                                const checked = (activeSt.reflectionValues || []).includes(vc);
                                return `<button class="btn btn-sm ${checked ? 'btn-gold' : 'btn-glass'}" onclick="toggleValueReflection(${activeSt.id}, '${vc}')">${checked ? '☑' : '☐'} ${vc}</button>`;

                        </div>
                    </div>

                    <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1);">

                                <div style="background: rgba(5,11,26,0.8); border: 1px solid rgba(245,185,66,0.35); border-radius: 14px; padding: 14px;">

                    </div>
                </div>
            </div>
        </div>`;
    }

    function setMathReflection(studentId, color) {
        const st = appState.students.find(s => s.id === studentId);
        if (!st) return;
        st.reflectionMath = color;
        saveState();
        renderAll();
    }

    function toggleValueReflection(studentId, valText) {
        const st = appState.students.find(s => s.id === studentId);
        if (!st) return;
        if (!st.reflectionValues) st.reflectionValues = [];
        const idx = st.reflectionValues.indexOf(valText);
        if (idx >= 0) st.reflectionValues.splice(idx, 1);
        else st.reflectionValues.push(valText);
        saveState();
        renderAll();
    }

    function launchFinalVideo() {
        finalSubView = 'video';
        renderAll();
        setTimeout(() => {
            const vid = document.getElementById('final-video');
            if (vid) vid.play().catch(() => {});
        }, 150);
    }

    function finishFinalVideo() {
        finalSubView = 'finale';
        playSuccessChime();
        renderAll();
    }

    /* ==========================================================================
       20. TEACHER CONTROL PANEL (МҰҒАЛІМНІҢ БАСҚАРУ ПАНЕЛІ)
       ========================================================================== */
    let activeTeacherTab = 'grading';

    function openTeacherDrawer(tabName) {
        if (tabName) activeTeacherTab = tabName;
        document.getElementById('lesson-date-input').value = appState.lessonDate;
        document.getElementById('teacher-drawer').classList.add('open');
        renderTeacherDrawerContent();
    }

    function closeTeacherDrawer() {
        document.getElementById('teacher-drawer').classList.remove('open');
    }

    function switchTeacherTab(tabName, btnEl) {
        activeTeacherTab = tabName;
        document.querySelectorAll('.drawer-tab-btn').forEach(b => {
            b.classList.remove('btn-gold');
            b.classList.add('btn-glass');
        });
        if (btnEl) {
            btnEl.classList.remove('btn-glass');
            btnEl.classList.add('btn-gold');
        }
        renderTeacherDrawerContent();
    }

        const presentStudents = appState.students.filter(s => s.present);

        if (activeTeacherTab === 'students') {
            body.innerHTML = `

                    <thead>

                            <tr>
                                <td>${idx + 1}</td>

                    <div style="font-size: 0.9rem; color: var(--gold-light);">
                        Барлық кезеңнің баллдары осында біріктірілген (Жалпы: 10 балл).

    function renderTriToggleBtn(studentId, field, idx, val) {

        let txt = '—';
        if (val === true) { cls = 'btn-green'; txt = '✔'; }
        else if (val === false) { cls = 'btn-red'; txt = '0'; }
        return `<button class="btn btn-xs ${cls}" title="Басу арқылы ауыстыру: Бағаланбады → Дұрыс → 0 балл" onclick="cycleDescriptorCheck(${studentId}, '${field}', ${idx})">${txt}</button>`;

    function cycleDescriptorCheck(studentId, field, idx) {
        const st = appState.students.find(s => s.id === studentId);
        if (!st) return;
        const cur = st[field][idx];
        st[field][idx] = cur === null ? true : (cur === true ? false : null);
        saveState();
        renderTeacherDrawerContent();
        if (appState.currentStageIndex === 8) renderAll();

    /* Excel бағдарламасында кириллицаны таза ашатын UTF-8 BOM CSV экспорт */
    function exportGradesCSV() {
        const present = appState.students.filter(s => s.present);
        const headers = ['№', 'Оқушының аты-жөні', 'Тобы', 'Теория (1)', 'Үй тапсырмасы (1)', 'Жеке жұмыс (2)', 'Тарсия (4)', 'Функц. сауаттылық (2)', 'Жалпы балл (10)', 'Пайыз (%)', 'Мәртебесі'];
        const rows = present.map((st, idx) => {
            const origIdx = appState.students.findIndex(x => x.id === st.id);
            const sc = calculateStudentScores(st);
            return [
                idx + 1,
                `"${getStudentDisplayName(st, origIdx)}"`,
                `"${TEAM_TEMPLATES[st.teamIndex ?? 0].name}"`,
                sc.theory ?? 'Бағаланбады',
                sc.hw ?? 'Бағаланбады',
                sc.ml ?? 'Бағаланбады',
                sc.tarsia ?? 'Бағаланбады',
                sc.rl ?? 'Бағаланбады',
                sc.total,
                sc.allRated ? sc.percent + '%' : 'Аралық',
                `"${getPedagogicalLevel(sc.total, sc.allRated).label}"`
            ].join(';');
        });

        const csvString = '\uFEFF' + [headers.join(';'), ...rows].join('\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MathPortal2026_Bagalau_${appState.lessonDate}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('📥 Excel (UTF-8 BOM CSV) файлы жүктелді');
    }

    /* JSON Резервтік көшірме және Импорт */
    function exportBackupJSON() {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MathPortal2026_Backup_${appState.lessonDate}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('💾 JSON резервтік көшірме жүктелді');
    }

    function importBackupJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (imported && Array.isArray(imported.students)) {
                    appState = Object.assign({}, appState, imported);
                    saveState();
                    renderAll();
                    renderTeacherDrawerContent();
                    showToast('✅ Деректер сәтті импортталды!');
                }
            } catch (err) {
                showToast('❌ JSON файлын оқу қатесі');
            }
        };
        reader.readAsText(file);
    }

            case 'homework': container.innerHTML = renderHomeworkPortal(); break;
            case 'mathlab': container.innerHTML = renderMathLabPortal(); break;
            case 'energy': container.innerHTML = renderEnergyBoostPortal(); break;
            case 'puzzle': container.innerHTML = renderPuzzlePortal(); break;
            case 'reallife': container.innerHTML = renderRealLifePortal(); break;
            case 'center': container.innerHTML = renderEnergyCenterPortal(); break;
            case 'final': container.innerHTML = renderFinalPortal(); break;
        }
    }

    /* Ғарыштық алтын және көгілдір бөлшектер анимациясы */
    function initSpaceCanvas() {
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 75 }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2.1 + 0.6,
            vx: (Math.random() - 0.5) * 0.28,
            vy: (Math.random() - 0.5) * 0.28,
            gold: Math.random() > 0.35
        }));

        function animate() {
            ctx.clearRect(0, 0, w, h);
            const grad = ctx.createRadialGradient(w * 0.5, h * 0.35, 40, w * 0.5, h * 0.5, Math.max(w, h) * 0.85);
            grad.addColorStop(0, '#0c1d42');
            grad.addColorStop(0.55, '#060e22');
            grad.addColorStop(1, '#030611');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.gold ? 'rgba(245, 185, 66, 0.55)' : 'rgba(56, 189, 248, 0.45)';
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();
    }

    window.onload = function () {
        initSpaceCanvas();
        loadState();
        renderAll();
    };
    </script>
